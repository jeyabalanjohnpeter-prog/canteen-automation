<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu - Admin</title>
    <!-- Premium Global CSS -->
    <link rel="stylesheet" href="modern_luxe.css">
    <style>
        body {
            padding-top: 110px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 50px;
        }

        .container h1 {
            font-size: 34px;
            margin-bottom: 30px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .form-section {
            padding: 30px;
            margin-bottom: 40px;
        }

        .form-section h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn-row {
            display: flex;
            gap: 15px;
        }

        .edit-btn {
            background: var(--warning-gradient);
            padding: 8px 16px;
            font-size: 13px;
        }

        .delete-btn {
            background: var(--secondary-gradient);
            padding: 8px 16px;
            font-size: 13px;
        }
        
        .cancel-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="animate-fade">

<nav>
    <div class="brand-area">
        <div class="admin-menu">
            <button type="button" class="menu-toggle" aria-label="Open admin menu">&#9776;</button>
            <div class="admin-menu-list">
                <a href="add_user.html">Add User</a>
            </div>
        </div>
        <div class="logo">Canteen <span style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Admin</span></div>
    </div>
    <div class="nav-links">
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="manage_orders.html">Manage Orders</a>
        <a href="manage_combo.html">Manage Combo</a>
        <a href="manage_menu.html" class="active-link">Manage Menu</a>
        <a class="logout" onclick="logout()" style="color:#f43f5e; cursor:pointer;">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>Manage Menu 🍽</h1>
    
    <div class="glass-container form-section animate-fade">
        <h2 id="formTitle">Add New Item</h2>
        <div class="form-grid">
            <input type="text" id="itemName" placeholder="Item Name">
            <input type="number" id="itemPrice" placeholder="Price">
            <select id="itemCategory">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="tea">Tea</option>
            </select>
        </div>
        <div class="btn-row">
            <button id="submitBtn" onclick="addItem()">Add Item</button>
            <button id="cancelBtn" class="cancel-btn" onclick="cancelEdit()">Cancel</button>
        </div>
    </div>

    <div class="glass-container" style="overflow-x: auto; padding: 25px;">
        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Item Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="menuTable">
                <!-- Dynamic menu listings -->
            </tbody>
        </table>
    </div>
</div>

<script src="format_money.js"></script>
<script>
    window.onload = displayMenu;

    let globalMenu = [];
    let editingMenuId = null;

    function displayMenu() {
        let table = document.getElementById("menuTable");
        table.innerHTML = ""; 

        fetch('/api/menu')
            .then(res => res.json())
            .then(menu => {
                globalMenu = menu;
                if(!menu || menu.length === 0) {
                    table.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No menu items added yet.</td></tr>`;
                    return;
                }
                menu.forEach((item) => {
                    let row = table.insertRow();
                    row.innerHTML = `
                        <td style="font-weight: 600; font-size:14px; color: var(--text-muted); text-transform: uppercase;">${item.category}</td>
                        <td><strong>${item.name}</strong></td>
                        <td style="font-weight:700; color:var(--text-main);">${formatMoney(item.price)}</td>
                        <td>
                            <div style="display:flex; gap:10px;">
                                <button class="edit-btn" onclick="startEdit('${item._id}')">Edit</button>
                                <button class="delete-btn" onclick="deleteItem('${item._id}')">Delete</button>
                            </div>
                        </td>
                    `;
                });
            })
            .catch(err => {
                console.error("Error loading menu:", err);
                table.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#fb7185;">Failed to load menu items.</td></tr>`;
            });
    }

    function addItem() {
        let name = document.getElementById("itemName").value;
        let price = document.getElementById("itemPrice").value;
        let category = document.getElementById("itemCategory").value;

        if (name == "" || price == "") {
            alert("Please fill all fields");
            return;
        }

        const itemData = { name: name, price: Number(price), category: category };

        if (editingMenuId === null) {
            // Adding New Item
            fetch('/api/menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemData)
            })
            .then(res => res.json())
            .then(data => {
                alert("Item added successfully!");
                resetForm();
                displayMenu();
            })
            .catch(err => {
                console.error("Error adding item:", err);
                alert("Failed to add menu item.");
            });
        } else {
            // Updating Existing Item
            fetch(`/api/menu/${editingMenuId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemData)
            })
            .then(res => res.json())
            .then(data => {
                alert("Item updated successfully!");
                cancelEdit();
                displayMenu();
            })
            .catch(err => {
                console.error("Error updating item:", err);
                alert("Failed to update menu item.");
            });
        }
    }

    function startEdit(itemId) {
        let item = globalMenu.find(m => m._id === itemId);
        if (!item) return;

        // Fill inputs with current data
        document.getElementById("itemName").value = item.name;
        document.getElementById("itemPrice").value = item.price;
        document.getElementById("itemCategory").value = item.category;

        // Change UI to Edit Mode
        editingMenuId = itemId;
        document.getElementById("formTitle").innerText = "Edit Menu Item";
        document.getElementById("submitBtn").innerText = "Update Item";
        document.getElementById("submitBtn").style.background = "var(--success-gradient)"; // Green gradient
        document.getElementById("cancelBtn").style.display = "inline-block";
        
        window.scrollTo(0, 0);
    }

    function cancelEdit() {
        editingMenuId = null;
        document.getElementById("formTitle").innerText = "Add New Item";
        document.getElementById("submitBtn").innerText = "Add Item";
        document.getElementById("submitBtn").style.background = "var(--primary-gradient)";
        document.getElementById("cancelBtn").style.display = "none";
        resetForm();
    }

    function resetForm() {
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemCategory").value = "breakfast";
    }

    function deleteItem(itemId) {
        if(confirm("Are you sure you want to remove this item?")) {
            fetch(`/api/menu/${itemId}`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                displayMenu();
            })
            .catch(err => {
                console.error("Error deleting menu item:", err);
                alert("Failed to delete menu item.");
            });
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "home.html";
    }
</script>
</body>
</html>
