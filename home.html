<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Automation - Home</title>
    <!-- Premium Global CSS -->
    <link rel="stylesheet" href="modern_luxe.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 80px;
        }

        .main-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .hero-section {
            background: linear-gradient(180deg, rgba(6, 9, 19, 0.3) 0%, rgba(6, 9, 19, 0.8) 100%), 
                        url('./images/home.webp') center/cover no-repeat;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 80px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .hero-content {
            max-width: 600px;
            text-align: left;
        }

        .hero-content h4 {
            color: #6366f1;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .hero-content h1 {
            font-size: 56px;
            line-height: 1.15;
            color: var(--text-main);
            font-weight: 800;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-family: 'Shadows Into Light', cursive;
        }

        .hero-btn {
            padding: 14px 32px;
            font-size: 16px;
            letter-spacing: 0.05em;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="animate-fade">

<nav>
    <div class="logo">Canteen <span style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Automation</span></div>
</nav>

<div class="main-container">
    <section class="hero-section">
        <div class="hero-content">
            <h4>LET'S GO, CANTEEN</h4>
            <h1>Smart Food<br>Ordering <span class="gradient-text">Automation</span></h1>
            <p>- Good food, good mood, order starts here.</p>
            <a href="login.html" class="btn hero-btn">Explore Menu</a>
        </div>
    </section>
</div>

</body>
</html>
