<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Combo - Canteen Admin</title>
    <!-- Premium Global CSS -->
    <link rel="stylesheet" href="modern_luxe.css">
    <style>
        body {
            padding-top: 110px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 50px;
        }

        .container h1 {
            font-size: 34px;
            margin-bottom: 30px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .form-section {
            padding: 30px;
            margin-bottom: 40px;
        }

        .form-section h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn-row {
            display: flex;
            gap: 15px;
        }

        .edit-btn {
            background: var(--warning-gradient);
            padding: 8px 16px;
            font-size: 13px;
        }

        .delete-btn {
            background: var(--secondary-gradient);
            padding: 8px 16px;
            font-size: 13px;
        }
        
        .cancel-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="animate-fade">

<nav>
    <div class="brand-area">
        <div class="admin-menu">
            <button type="button" class="menu-toggle" aria-label="Open admin menu">&#9776;</button>
            <div class="admin-menu-list">
                <a href="add_user.html">Add User</a>
            </div>
        </div>
        <div class="logo">Canteen <span style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Admin</span></div>
    </div>
    <div class="nav-links">
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="manage_orders.html">Manage Orders</a>
        <a href="manage_combo.html" class="active-link">Manage Combo</a>
        <a href="manage_menu.html">Manage Menu</a>
        <a class="logout" onclick="logout()" style="color:#f43f5e; cursor:pointer;">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>Manage Combo 🍱</h1>
    
    <div class="glass-container form-section animate-fade">
        <h2 id="formTitle">Add New Combo</h2>
        <div class="form-grid">
            <input type="text" id="comboName" placeholder="Combo Name">
            <input type="text" id="comboItems" placeholder="Items (e.g. Burger, Coke)">
            <input type="number" id="comboPrice" placeholder="Price">
            <input type="text" id="comboImg" placeholder="Image URL">
        </div>
        <div class="btn-row">
            <button id="submitBtn" onclick="addCombo()">Add Combo</button>
            <button id="cancelBtn" class="cancel-btn" onclick="cancelEdit()">Cancel</button>
        </div>
    </div>

    <div class="glass-container" style="overflow-x: auto; padding: 25px;">
        <table>
            <thead>
                <tr>
                    <th>Combo Name</th>
                    <th>Items</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="comboTable">
                <!-- Dynamic combo listings -->
            </tbody>
        </table>
    </div>
</div>

<script src="format_money.js"></script>
<script>
    window.onload = displayCombos;
    
    let globalCombos = [];
    let editingComboId = null;

    function displayCombos() {
        let table = document.getElementById("comboTable");
        
        fetch('/api/combos')
            .then(res => res.json())
            .then(combos => {
                globalCombos = combos;
                if(!combos || combos.length === 0) {
                    table.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No combos added yet.</td></tr>`;
                    return;
                }

                table.innerHTML = combos.map((c) => `
                    <tr>
                        <td><strong>${c.name}</strong></td>
                        <td>${c.items}</td>
                        <td style="font-weight:700; color:var(--text-main);">${formatMoney(c.price)}</td>
                        <td>
                            <div style="display:flex; gap:10px;">
                                <button class="edit-btn" onclick="startEdit('${c._id}')">Edit</button>
                                <button class="delete-btn" onclick="deleteCombo('${c._id}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            })
            .catch(err => {
                console.error("Error loading combos:", err);
                table.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#fb7185;">Failed to load combos.</td></tr>`;
            });
    }

    function addCombo() {
        let name = document.getElementById("comboName").value;
        let items = document.getElementById("comboItems").value;
        let price = document.getElementById("comboPrice").value;
        let img = document.getElementById("comboImg").value || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500";

        if(!name || !items || !price) {
            alert("Please fill name, items, and price!");
            return;
        }

        const comboData = { name, items, price: Number(price), img };

        if (editingComboId === null) {
            // Adding New Combo
            fetch('/api/combos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(comboData)
            })
            .then(res => res.json())
            .then(data => {
                alert("Combo Added!");
                resetForm();
                displayCombos();
            })
            .catch(err => {
                console.error("Error adding combo:", err);
                alert("Failed to add combo.");
            });
        } else {
            // Updating Existing Combo
            fetch(`/api/combos/${editingComboId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(comboData)
            })
            .then(res => res.json())
            .then(data => {
                alert("Combo Updated!");
                cancelEdit();
                displayCombos();
            })
            .catch(err => {
                console.error("Error updating combo:", err);
                alert("Failed to update combo.");
            });
        }
    }

    function startEdit(comboId) {
        let item = globalCombos.find(c => c._id === comboId);
        if (!item) return;

        // Fill form
        document.getElementById("comboName").value = item.name;
        document.getElementById("comboItems").value = item.items;
        document.getElementById("comboPrice").value = item.price;
        document.getElementById("comboImg").value = item.img;

        // Set edit mode
        editingComboId = comboId;
        document.getElementById("formTitle").innerText = "Edit Combo Details";
        document.getElementById("submitBtn").innerText = "Update Combo";
        document.getElementById("submitBtn").style.background = "var(--success-gradient)";
        document.getElementById("cancelBtn").style.display = "inline-block";
        
        window.scrollTo(0, 0);
    }

    function cancelEdit() {
        editingComboId = null;
        document.getElementById("formTitle").innerText = "Add New Combo";
        document.getElementById("submitBtn").innerText = "Add Combo";
        document.getElementById("submitBtn").style.background = "var(--primary-gradient)";
        document.getElementById("cancelBtn").style.display = "none";
        resetForm();
    }

    function resetForm() {
        document.getElementById("comboName").value = "";
        document.getElementById("comboItems").value = "";
        document.getElementById("comboPrice").value = "";
        document.getElementById("comboImg").value = "";
    }

    function deleteCombo(comboId) {
        if(confirm("Are you sure you want to delete this combo?")) {
            fetch(`/api/combos/${comboId}`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                displayCombos();
            })
            .catch(err => {
                console.error("Error deleting combo:", err);
                alert("Failed to delete combo.");
            });
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "home.html";
    }
</script>
</body>
</html>
